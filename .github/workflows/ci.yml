name: CI

on:
  push:
  pull_request:

# 所有 action 已升级到 Node 24 运行时版本，无弃用告警。
# 历史告警均已根治：
#   - "git failed with exit code 128"：曾因 GitSource/ 被误当 submodule 跟踪（无 .gitmodules），
#     已从 index 移除 gitlink 并整目录忽略 GitSource/。
#   - "Restore cache failed: go.sum"：仓库未提交 go.sum，setup-go 用 cache:false 关闭。
#   - "Node.js 20 is deprecated"：官方/第三方 action 已升级到 node24 运行时。

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClawRuntime/runtime
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: ClawRuntime/runtime/go.mod
          cache: false   # 仓库未提交 go.sum，关闭依赖缓存避免 Restore cache 警告
      - name: Run Go tests
        run: go test ./...

  app-compile:
    runs-on: ubuntu-latest
    env:
      CLAWDROID_RUNTIME_SHARED_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    defaults:
      run:
        working-directory: ClawApp
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Compile debug Kotlin
        shell: bash
        run: ./gradlew :app:compileDebugKotlin

  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Verify required project files
        shell: bash
        run: |
          test -f LICENSE
          test -f README.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f THIRD_PARTY_NOTICES.md
          test -f Docs/compatibility-matrix.md
          test -f Docs/release-notes.md
          test -f Docs/下一步计划.md
          test -f Docs/assist-mcp.md
          test -f Docs/xposed-adapters.md
          test -f ClawRuntime/magisk/config/runtime.yaml
          test -f ClawRuntime/magisk/config/runtime.yaml.example
      - name: Check Runtime action/error catalog alignment
        shell: bash
        run: python3 scripts/check_runtime_catalog.py
